name: Build Xposed APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Prepare Xposed Compile JAR
        shell: bash
        run: |
          set -e

          mkdir -p \
            tmp_stub/de/robv/android/xposed/callbacks \
            app/libs

          cat > tmp_stub/de/robv/android/xposed/callbacks/XC_LoadPackage.java <<'EOF'
          package de.robv.android.xposed.callbacks;

          public abstract class XC_LoadPackage {
              public static final class LoadPackageParam {
                  public String packageName;
                  public ClassLoader classLoader;
              }
          }
          EOF

          cat > tmp_stub/de/robv/android/xposed/IXposedHookLoadPackage.java <<'EOF'
          package de.robv.android.xposed;

          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          public interface IXposedHookLoadPackage {
              void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam)
                      throws Throwable;
          }
          EOF

          cat > tmp_stub/de/robv/android/xposed/XC_MethodHook.java <<'EOF'
          package de.robv.android.xposed;

          import java.lang.reflect.Member;

          public abstract class XC_MethodHook {
              public static class MethodHookParam {
                  public Member method;
                  public Object thisObject;
                  public Object[] args;
                  public Object getResult() { return null; }
                  public void setResult(Object result) {}
              }

              protected void beforeHookedMethod(MethodHookParam param) {}

              protected void afterHookedMethod(MethodHookParam param) {}

              public class Unhook {}
          }
          EOF

          cat > tmp_stub/de/robv/android/xposed/XposedBridge.java <<'EOF'
          package de.robv.android.xposed;

          public final class XposedBridge {
              public static void log(String text) {}

              public static void log(Throwable text) {}
          }
          EOF

          cat > tmp_stub/de/robv/android/xposed/XposedHelpers.java <<'EOF'
          package de.robv.android.xposed;

          public final class XposedHelpers {
              public static XC_MethodHook.Unhook findAndHookMethod(
                      Class<?> clazz,
                      String methodName,
                      Object... args
              ) {
                  return null;
              }

              public static Object getObjectField(
                      Object obj,
                      String fieldName
              ) {
                  return null;
              }
          }
          EOF

          java_files=$(find tmp_stub -name '*.java')

          javac -d tmp_stub/out $java_files
          jar cf app/libs/xposed-api.jar -C tmp_stub/out .

          python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text()

          text = text.replace(
              '"de.robv.android.xposed:api:82"',
              'files("libs/xposed-api.jar")'
          )

          path.write_text(text)
          PY

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses \
            >/dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LyricAutoTranslator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
